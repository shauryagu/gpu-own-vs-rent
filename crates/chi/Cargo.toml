[package]
name = "chi"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "chi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
domain = { path = "../domain" }
ingest = { path = "../ingest" }
project = { path = "../project" }
rust_decimal = "1.42.1"
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting"] }
